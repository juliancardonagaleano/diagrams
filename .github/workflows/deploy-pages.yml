name: Deploy to GitHub Pages

# Compuerta de calidad + publicación del sitio estático en la rama `gh-pages`, de donde lo sirve Pages
# (Settings → Pages → Deploy from a branch → gh-pages / root).
#
# Jobs:
#  - build   Compila el sitio (dist/pages, con la ruta base /<repositorio>/) y lo guarda como artefacto.
#  - test    Compuerta de calidad: `npm run typecheck` + `npx vitest run`. `publish` depende de él: con pruebas
#            rojas no se publica nada. Además avisa (sin bloquear) de dependencias con avisos de seguridad altos.
#  - e2e     Pruebas de extremo a extremo con Playwright (Chromium). De momento informativo: NO está en el `needs` de
#            `publish`. Se pasará a obligatorio cuando haya varias ejecuciones verdes seguidas en master (así un test
#            inestable no bloquea publicaciones mientras se comprueba su fiabilidad): bastará con añadir `e2e` al
#            `needs` de `publish`.
#  - packages Los paquetes publicables (`@iark/kernel` y `@iark/domain-*`): `npm run packages:check` los empaqueta con `npm pack`, los
#            instala en una carpeta limpia y comprueba que se importan y que el módulo de terceros de ejemplo carga con `iark --config`
#            usando SOLO los tarballs. Informativo, igual que `e2e`: NO está en el `needs` de `publish`. Publicar en npm es otro
#            workflow, manual (release-packages.yml).
#  - publish Solo desde master (push o ejecución manual), nunca en pull request: publica con scripts/deploy-gh-pages.sh
#            y comprueba con scripts/verify-pages.sh que el sitio sirve la compilación nueva y responde 200.
#
# `build`, `test` y `e2e` corren en pull request hacia master, en push a master y en ejecución manual (en un PR no se publica).
# `npm run deploy:pages` sigue valiendo para publicar a mano desde un equipo con permiso de escritura.

on:
  push:
    branches: [master]
    # Se ignora lo que no puede cambiar ni el sitio ni el resultado de las pruebas: la documentación (`**/*.md`, `docs/**`)
    # y los artefactos de despliegue en contenedor (`deploy/**`, Dockerfile, .dockerignore); ninguna prueba lee esos archivos.
    # `tests/**` YA NO se ignora: un cambio solo en pruebas (o en el código que las prueba) debe pasar por la compuerta `test`.
    # Ojo: un push a master de solo documentación no dispara el workflow (no hay nada que publicar). En los pull request el
    # filtro se quitó a propósito: `test` es comprobación obligatoria y debe reportarse siempre.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
  pull_request:
    # Sin `paths-ignore`: `test` es comprobación obligatoria de `master`, y un PR solo de documentación que no la reportara
    # quedaría «esperando» para siempre. El coste es una ejecución más en esos PR; en el push a master se sigue ignorando.
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Sin `env` global: BASE_PATH/PAGES_URL son cosas de Pages y viven en los jobs `build` y `publish`. `e2e` sirve la app en la
# raíz (`/`, la ruta base por defecto de vite), así que no debe heredar BASE_PATH=/<repositorio>/.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pages sirve bajo /<repositorio>/ (se ajusta solo si el repositorio se renombra).
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compilar el sitio
        run: npm run build:app
        env:
          OUT_DIR: dist/pages
      - uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: dist/pages
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  test:
    # Tipos + pruebas (vitest). La suite completa tarda unos minutos: el margen del timeout es holgado a propósito.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Auditoría de dependencias (solo avisa)
        id: audit
        # No bloquea (`continue-on-error`): un aviso nuevo en una dependencia ajena no debe impedir publicar ni fusionar
        # un cambio que no la toca. Falla con avisos de gravedad alta o crítica; los bajos de `katex`/`mermaid` se aceptan
        # (su único arreglo propuesto es bajar a Mermaid 10). El aviso queda como anotación de la ejecución.
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Anotar el aviso de la auditoría
        if: steps.audit.outcome == 'failure'
        run: echo "::warning title=npm audit::Hay dependencias con avisos de seguridad de gravedad alta (o la auditoría no pudo consultarse). No bloquea; revisa el paso «Auditoría de dependencias»."
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Pruebas (vitest)
        run: npx vitest run --reporter=dot

  e2e:
    # Informativo por ahora: NO forma parte del `needs` de `publish` (ver la cabecera del archivo).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # playwright.config.ts usa, en CI, el Chromium que gestiona Playwright (no el de /opt/pw-browsers del contenedor de desarrollo).
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      # dist/app (ruta base `/`): es lo que sirve `vite preview` en las pruebas e2e. No reutiliza el artefacto de `build`,
      # que se compila para Pages con la ruta base /<repositorio>/.
      - name: Compilar la app
        run: npm run build:app
      - name: Pruebas e2e (Playwright)
        run: npx playwright test
      - name: Subir informe y trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  packages:
    # Informativo por ahora: NO forma parte del `needs` de `publish` (ver la cabecera del archivo).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Compila los siete paquetes (JS + tipos), los empaqueta, los instala en una carpeta temporal y prueba import, tipos, el plugin
      # de ejemplo con `iark --config` y `iark serve --config`. Necesita red (npm install de las dependencias de los tarballs).
      - name: Empaquetar, instalar y probar los paquetes publicables
        run: npm run packages:check

  publish:
    # Solo desde master: un pull request nunca publica.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    # Con tipos o pruebas rojos no se publica. `e2e` queda fuera a propósito (todavía).
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    # Un solo despliegue a la vez, y sin cancelar el que está empujando a gh-pages.
    concurrency:
      group: publish-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: dist/pages
      - name: ¿Sigue siendo este el último master?
        id: latest
        run: |
          head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::master ya avanzó ($head); este despliegue se omite y lo hará la ejecución más reciente."
          fi
      - name: Publicar en gh-pages
        if: steps.latest.outputs.current == 'true'
        run: SKIP_BUILD=1 bash scripts/deploy-gh-pages.sh
      - name: Comprobar el sitio publicado
        if: steps.latest.outputs.current == 'true'
        run: bash scripts/verify-pages.sh "$PAGES_URL" dist/pages
        env:
          # El despliegue de Pages suele tardar ~1 min, pero a veces varios.
          VERIFY_TIMEOUT: 900
