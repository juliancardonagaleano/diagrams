name: Error
description: Algo no funciona como debería (el CLI, el servicio, el widget o la app web)
title: "[Error] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. **Si crees que es una vulnerabilidad de seguridad, no uses este formulario**: sigue [SECURITY.md](https://github.com/juliancardonagaleano/DIAgrams/blob/master/SECURITY.md).

        Cuanto más fácil sea reproducirlo, más rápido se arregla. Si puedes, adjunta el documento (JSON, `.drawio`, `.dsl`, Mermaid…) mínimo que lo provoca, sin datos privados.
  - type: dropdown
    id: componente
    attributes:
      label: Dónde ocurre
      options:
        - CLI `iark`
        - Servicio `iark serve` o imagen Docker
        - Widget embebible (iframe, SDK o Web Component)
        - Editor C4 (app web)
        - Banco de trabajo de módulos (app web)
        - Trazabilidad o shell de la suite (app web)
        - Documentación
        - Otro
    validations:
      required: true
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo implicado
      options:
        - No aplica / varios
        - C4
        - Integración
        - Datos
        - Empresarial
        - Plataforma
        - Seguridad
    validations:
      required: true
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre
      description: Lo que ves, con el mensaje de error completo si lo hay.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Comandos o clics exactos, y el documento de entrada si hace falta.
      placeholder: |
        1. iark import tienda.tf --module platform
        2. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      description: Salida de `iark --version`, o el commit de `master` (o de la imagen) que usas.
      placeholder: "0.1.0 / 7703b36"
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      description: Sistema operativo, versión de Node (`node -v`), navegador, y si es el servicio, cómo lo arrancas (opciones de `iark serve`, Docker o no).
      render: text
  - type: textarea
    id: registros
    attributes:
      label: Registros o capturas
      description: Salida de la terminal, consola del navegador o captura. Quita antes tokens, claves de API y secretos.
  - type: checkboxes
    id: confirmaciones
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué en los issues abiertos y cerrados y no encontré uno igual.
          required: true
        - label: No es una vulnerabilidad de seguridad (para eso, SECURITY.md) y no incluí secretos ni datos privados.
          required: true
