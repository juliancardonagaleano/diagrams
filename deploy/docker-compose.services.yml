# Despliegue multi-proceso (specs 002–009): gateway + identity + app + SSE, con Postgres y Caddy.
# El monolito sigue siendo `docker-compose.yml` (`iark serve`). Este stack reparte los módulos `diagrams-*`
# en procesos distintos reutilizando la misma imagen; cada uno expone /healthz y un /readyz acotado a lo que posee.
#
#   cp .env.example .env
#   docker volume create iark-data
#   docker compose -f docker-compose.services.yml up -d --build
#
# Comandos equivalentes (sin compose): `iark serve-gateway`, `serve-identity`, `serve-app`, `serve-sse`
# o `IARK_SERVE_ROLE=gateway|identity|app|sse` con `iark serve` (salvo sse, que sigue siendo serve-sse).
name: iark

x-iark-image: &iark-image
  build:
    context: ..
  image: diagrams
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-iark-env-common: &iark-env-common
  IARK_TRUST_PROXY: "true"
  IARK_CORS: "${IARK_CORS:-}"
  IARK_WORKSPACE_STORE: postgres
  IARK_ACCOUNTS_STORE: postgres
  IARK_DATABASE_URL: "${IARK_DATABASE_URL:?Falta IARK_DATABASE_URL}"
  IARK_DATABASE_POOL: "${IARK_DATABASE_POOL:-5}"
  IARK_DATABASE_CA_FILE: "${IARK_DATABASE_CA_FILE:-}"
  IARK_DATABASE_SSL: "${IARK_DATABASE_SSL:-}"
  IARK_GITHUB_CLIENT_ID: "${IARK_GITHUB_CLIENT_ID:?Falta IARK_GITHUB_CLIENT_ID}"
  IARK_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
  IARK_PUBLIC_URL: "https://${IARK_DOMAIN:?Falta IARK_DOMAIN}"
  IARK_ADMINS: "${IARK_ADMINS:?Falta IARK_ADMINS}"
  IARK_SIGNUP: "${IARK_SIGNUP:-invite}"
  IARK_ACCESS_LOG: "${IARK_ACCESS_LOG:--}"
  IARK_METRICS: "${IARK_METRICS:-}"
  IARK_METRICS_TOKEN: "${IARK_METRICS_TOKEN:-}"

services:
  iark-gateway:
    <<: *iark-image
    command: ['node', 'dist/cli/main.js', 'serve-gateway', '--host', '0.0.0.0', '--port', '8787', '--trust-proxy']
    environment:
      <<: *iark-env-common
      IARK_WORKERS: "${IARK_WORKERS:-}"
      IARK_COMPUTE_TIMEOUT_MS: "${IARK_COMPUTE_TIMEOUT_MS:-}"
      IARK_COMPUTE_QUEUE: "${IARK_COMPUTE_QUEUE:-}"
    secrets:
      - github_client_secret
    expose:
      - "8787"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200

  iark-identity:
    <<: *iark-image
    command: ['node', 'dist/cli/main.js', 'serve-identity', '--host', '0.0.0.0', '--port', '8789', '--trust-proxy', '--workspace-store', 'postgres']
    environment:
      <<: *iark-env-common
      IARK_SESSION_DAYS: "${IARK_SESSION_DAYS:-}"
      IARK_MAX_PROJECTS: "${IARK_MAX_PROJECTS:-}"
      IARK_MAX_DIAGRAMS: "${IARK_MAX_DIAGRAMS:-}"
      IARK_MAX_BYTES: "${IARK_MAX_BYTES:-}"
      IARK_AUDIT_LOG: "${IARK_AUDIT_LOG:-/data/audit-identity.jsonl}"
    secrets:
      - github_client_secret
    volumes:
      - iark-data:/data
    expose:
      - "8789"
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 150

  iark-app:
    <<: *iark-image
    command: ['node', 'dist/cli/main.js', 'serve-app', '--host', '0.0.0.0', '--port', '8790', '--trust-proxy', '--workspace-store', 'postgres']
    environment:
      <<: *iark-env-common
      IARK_EVENTS_BRIDGE: "${IARK_EVENTS_BRIDGE:-postgres}"
      IARK_EVENTS_ROLE: publish
      IARK_AUDIT_LOG: "${IARK_AUDIT_LOG:-/data/audit.jsonl}"
    secrets:
      - github_client_secret
    volumes:
      - iark-data:/data
    expose:
      - "8790"
    depends_on:
      iark-identity:
        condition: service_started
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200

  iark-sse:
    <<: *iark-image
    command: ['node', 'dist/cli/main.js', 'serve-sse', '--host', '0.0.0.0', '--port', '8788', '--trust-proxy', '--workspace-store', 'postgres']
    environment:
      <<: *iark-env-common
      IARK_DATABASE_POOL: "${IARK_DATABASE_POOL:-3}"
      IARK_DATABASE_SESSION_URL: "${IARK_DATABASE_SESSION_URL:?Falta IARK_DATABASE_SESSION_URL (sesión Postgres para LISTEN)}"
      IARK_EVENTS_BRIDGE: "${IARK_EVENTS_BRIDGE:-postgres}"
      IARK_EVENTS_ROLE: stream
    secrets:
      - github_client_secret
    volumes:
      - iark-data:/data
    expose:
      - "8788"
    depends_on:
      iark-app:
        condition: service_started
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      iark-gateway:
        condition: service_started
      iark-identity:
        condition: service_started
      iark-app:
        condition: service_started
      iark-sse:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      IARK_DOMAIN: "${IARK_DOMAIN:?Falta IARK_DOMAIN}"
    volumes:
      - ./Caddyfile.services:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  iark-data:
    external: true
  caddy-data:
  caddy-config:

secrets:
  github_client_secret:
    file: ./secrets/github_client_secret
