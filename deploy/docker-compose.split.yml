# Despliegue Postgres con procesos partidos (spec 005): `iark` publica avisos (NOTIFY); `iark-sse` atiende GET /api/events (LISTEN).
# Para gateway + identity + app + SSE en contenedores distintos, use docker-compose.services.yml.
# El compose por omisión (`docker-compose.yml`) sigue siendo monolito con carpeta en volumen.
#
# Requisitos: mismo `.env` que la guía de nube, más IARK_DATABASE_URL (pooler transaccional) e IARK_DATABASE_SESSION_URL
# (conexión de sesión directa, p. ej. puerto 5432 en Supabase, para LISTEN fuera del pooler).
#
#   cp .env.example .env    # rellena dominio, GitHub, IARK_DATABASE_* y admins
#   docker volume create iark-data
#   docker compose -f docker-compose.split.yml up -d --build
#
# Variables clave:
#   IARK_WORKSPACE_STORE=postgres · IARK_ACCOUNTS_STORE=postgres
#   iark (app): IARK_EVENTS_ROLE=publish — escribe proyectos y NOTIFY; no abre SSE en este proceso
#   iark-sse: IARK_EVENTS_ROLE=stream — solo canal y autenticación; LISTEN en IARK_DATABASE_SESSION_URL
#   IARK_EVENTS_BRIDGE=postgres (omisión con proyectos en Postgres) · memory fuerza hub in-process (solo una instancia)
name: iark

services:
  iark:
    build:
      context: ..
    image: diagrams
    restart: unless-stopped
    environment:
      IARK_TRUST_PROXY: "true"
      IARK_CORS: "${IARK_CORS:-}"
      IARK_FRAME_ANCESTORS: "${IARK_FRAME_ANCESTORS:-}"
      IARK_WORKERS: "${IARK_WORKERS:-}"
      IARK_COMPUTE_TIMEOUT_MS: "${IARK_COMPUTE_TIMEOUT_MS:-}"
      IARK_COMPUTE_QUEUE: "${IARK_COMPUTE_QUEUE:-}"
      IARK_WORKSPACE_STORE: postgres
      IARK_ACCOUNTS_STORE: postgres
      IARK_DATABASE_URL: "${IARK_DATABASE_URL:?Falta IARK_DATABASE_URL (pooler transaccional, p. ej. Supabase :6543)}"
      IARK_DATABASE_POOL: "${IARK_DATABASE_POOL:-5}"
      IARK_DATABASE_SESSION_URL: "${IARK_DATABASE_SESSION_URL:-}"
      IARK_DATABASE_CA_FILE: "${IARK_DATABASE_CA_FILE:-}"
      IARK_DATABASE_SSL: "${IARK_DATABASE_SSL:-}"
      IARK_EVENTS_BRIDGE: "${IARK_EVENTS_BRIDGE:-postgres}"
      IARK_EVENTS_ROLE: publish
      IARK_GITHUB_CLIENT_ID: "${IARK_GITHUB_CLIENT_ID:?Falta IARK_GITHUB_CLIENT_ID en deploy/.env}"
      IARK_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      IARK_PUBLIC_URL: "https://${IARK_DOMAIN:?Falta IARK_DOMAIN en deploy/.env}"
      IARK_ADMINS: "${IARK_ADMINS:?Falta IARK_ADMINS en deploy/.env}"
      IARK_SIGNUP: "${IARK_SIGNUP:-invite}"
      IARK_SESSION_DAYS: "${IARK_SESSION_DAYS:-}"
      IARK_MAX_PROJECTS: "${IARK_MAX_PROJECTS:-}"
      IARK_MAX_DIAGRAMS: "${IARK_MAX_DIAGRAMS:-}"
      IARK_MAX_BYTES: "${IARK_MAX_BYTES:-}"
      IARK_GITHUB_URL: "${IARK_GITHUB_URL:-}"
      IARK_GITHUB_API_URL: "${IARK_GITHUB_API_URL:-}"
      IARK_ACCESS_LOG: "${IARK_ACCESS_LOG:--}"
      IARK_AUDIT_LOG: "${IARK_AUDIT_LOG:-/data/audit.jsonl}"
      IARK_METRICS: "${IARK_METRICS:-}"
      IARK_METRICS_TOKEN: "${IARK_METRICS_TOKEN:-}"
    secrets:
      - github_client_secret
    volumes:
      - iark-data:/data
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  iark-sse:
    image: diagrams
    restart: unless-stopped
    command:
      - node
      - dist/cli/main.js
      - serve-sse
      - --host
      - "0.0.0.0"
      - --port
      - "8788"
      - --trust-proxy
      - --workspace-store
      - postgres
    environment:
      IARK_TRUST_PROXY: "true"
      IARK_CORS: "${IARK_CORS:-}"
      IARK_WORKSPACE_STORE: postgres
      IARK_ACCOUNTS_STORE: postgres
      IARK_DATABASE_URL: "${IARK_DATABASE_URL}"
      IARK_DATABASE_POOL: "${IARK_DATABASE_POOL:-3}"
      IARK_DATABASE_SESSION_URL: "${IARK_DATABASE_SESSION_URL:?Falta IARK_DATABASE_SESSION_URL (sesión Postgres para LISTEN, p. ej. :5432 directo)}"
      IARK_DATABASE_CA_FILE: "${IARK_DATABASE_CA_FILE:-}"
      IARK_DATABASE_SSL: "${IARK_DATABASE_SSL:-}"
      IARK_EVENTS_BRIDGE: "${IARK_EVENTS_BRIDGE:-postgres}"
      IARK_EVENTS_ROLE: stream
      IARK_GITHUB_CLIENT_ID: "${IARK_GITHUB_CLIENT_ID}"
      IARK_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      IARK_PUBLIC_URL: "https://${IARK_DOMAIN}"
      IARK_ADMINS: "${IARK_ADMINS}"
      IARK_SIGNUP: "${IARK_SIGNUP:-invite}"
      IARK_ACCESS_LOG: "${IARK_ACCESS_LOG:--}"
      IARK_METRICS: "${IARK_METRICS:-}"
      IARK_METRICS_TOKEN: "${IARK_METRICS_TOKEN:-}"
    secrets:
      - github_client_secret
    volumes:
      - iark-data:/data
    expose:
      - "8788"
    depends_on:
      iark:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      iark:
        condition: service_healthy
      iark-sse:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      IARK_DOMAIN: "${IARK_DOMAIN:?Falta IARK_DOMAIN en deploy/.env}"
    volumes:
      - ./Caddyfile.split:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  iark-data:
    external: true
  caddy-data:
  caddy-config:

secrets:
  github_client_secret:
    file: ./secrets/github_client_secret
