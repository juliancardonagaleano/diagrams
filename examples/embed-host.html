    <style>:root{color:#222;font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif}body{background:#f3f4f6;grid-template-rows:auto 1fr;height:100vh;margin:0;display:grid}header{background:#fff;border-bottom:1px solid #e5e7eb;align-items:center;gap:8px;padding:10px 14px;display:flex}header h1{margin:0 12px 0 0;font-size:15px}button{font:inherit;cursor:pointer;background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:6px 10px}button:hover{background:#f9fafb}main{grid-template-columns:1fr 360px;min-height:0;display:grid}#editor{background:#fff;min-height:0}aside{background:#fff;border-left:1px solid #e5e7eb;flex-direction:column;min-height:0;display:flex}aside h2{color:#374151;border-bottom:1px solid #e5e7eb;margin:0;padding:8px 12px;font-size:13px}#log{white-space:pre-wrap;flex:1;margin:0;padding:8px 12px;font:11px/1.5 ui-monospace,Menlo,monospace;overflow:auto}.badge{color:#075985;background:#e0f2fe;border-radius:999px;padding:2px 8px;font-size:11px}</style>

      <button id="btn-json">Exportar JSON</button>
      <button id="btn-layout">Autolayout →</button>
