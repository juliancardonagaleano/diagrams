openapi: 3.0.3
info:
  title: Tienda de mascotas
  description: |
    API de ejemplo de una tienda de mascotas, con la forma del ejemplo clásico «Petstore» de OpenAPI.

    Segundo párrafo que no debe llegar a la descripción del sistema.
  version: 1.0.7
  contact:
    name: Equipo de Catálogo
    email: catalogo@example.com
  license:
    name: Apache 2.0
servers:
  - url: https://{entorno}.tienda.example.com/api/v3
    description: Servidor principal
    variables:
      entorno:
        default: mascotas
  - url: https://usuario:secreto@staging.tienda.example.com/api/v3
    description: Preproducción
tags:
  - name: pet
    description: Todo sobre tus mascotas
  - name: store
    description: Acceso a los pedidos de la tienda
  - name: user
    description: Operaciones sobre usuarios
paths:
  /pet:
    put:
      tags: [pet]
      summary: Actualiza una mascota existente
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Operación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Mascota no encontrada
      security:
        - petstore_auth: [write:pets, read:pets]
    post:
      tags: [pet]
      summary: Añade una mascota a la tienda
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Operación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
      security:
        - petstore_auth: [write:pets, read:pets]
  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Busca mascotas por estado
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: available
            enum: [available, pending, sold]
      responses:
        '200':
          description: Operación correcta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
      security:
        - petstore_auth: [read:pets]
  /pet/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [pet]
      summary: Busca una mascota por su id
      operationId: getPetById
      responses:
        '200':
          description: Operación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Mascota no encontrada
      security:
        - api_key: []
    delete:
      tags: [pet]
      summary: Borra una mascota
      operationId: deletePet
      deprecated: true
      responses:
        '400':
          description: Valor de id no válido
      security:
        - petstore_auth: [write:pets]
  /store/inventory:
    get:
      tags: [store]
      summary: Devuelve el inventario por estado
      operationId: getInventory
      responses:
        '200':
          description: Operación correcta
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
      security:
        - api_key: []
  /store/order:
    post:
      tags: [store]
      summary: Hace un pedido de una mascota
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Operación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /user:
    post:
      tags: [user]
      summary: Crea un usuario
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        default:
          description: Operación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /user/login:
    get:
      tags: [user]
      summary: Inicia sesión
      operationId: loginUser
      responses:
        '200':
          description: Operación correcta
          content:
            application/json:
              schema:
                type: string
          headers:
            X-Rate-Limit:
              description: Llamadas permitidas por hora
              schema:
                type: integer
        '400':
          description: Usuario o clave no válidos
components:
  parameters:
    PetId:
      name: petId
      in: path
      description: Id de la mascota
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Pet:
      type: object
      required: [name, photoUrls]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Rufo
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [available, pending, sold]
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        status:
          type: string
          enum: [placed, approved, delivered]
        complete:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        password:
          type: string
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://tienda.example.com/oauth/authorize
          scopes:
            write:pets: modificar mascotas
            read:pets: leer mascotas
    api_key:
      type: apiKey
      name: api_key
      in: header
