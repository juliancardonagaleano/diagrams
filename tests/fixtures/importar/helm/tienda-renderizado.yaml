# Source: tienda/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda
  labels:
    helm.sh/chart: tienda-0.4.2
    app.kubernetes.io/name: tienda
    app.kubernetes.io/instance: tienda
    app.kubernetes.io/version: "2.7.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tienda
      app.kubernetes.io/instance: tienda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tienda
        app.kubernetes.io/instance: tienda
    spec:
      serviceAccountName: tienda
      containers:
        - name: tienda
          image: "registry.example.com/comercio/tienda-web:2.7.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_HOST
              value: tienda-postgresql
            - name: REDIS_HOST
              value: tienda-redis-master
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tienda-postgresql
                  key: password
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: datos
              mountPath: /var/lib/tienda
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: tienda-datos
